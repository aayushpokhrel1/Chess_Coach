<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Coach</title>
  </head>
  <body>
    <main id="app">
      <h1>Chess Coach</h1>
      <textarea id="pgn" rows="4" placeholder="Paste PGN here"></textarea>
      <div class="controls">
        <button id="load">Load</button>
        <button id="analyze">Analyze</button>
        <span id="status"></span>
      </div>
      <div class="controls">
        <input id="username" placeholder="Your username (as in the PGN)" />
        <button id="analyzeAll">Analyze all games</button>
        <span id="reportStatus"></span>
      </div>
      <div id="report" class="report"></div>
      <div class="layout">
        <div>
          <div id="board" class="board"></div>
          <div id="nav">
            <button id="prev">&larr;</button>
            <span id="ply">-</span>
            <button id="next">&rarr;</button>
          </div>
        </div>
        <div class="side">
          <div id="explain" class="explain"></div>
          <ol id="moves" class="moves"></ol>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
